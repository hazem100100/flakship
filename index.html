                                                    <img src={product.images[0]} alt="" className="w-12 h-12 rounded-xl object-cover" />
                                                    <span className="font-bold">{product.nameAr}</span>
                                                </td>
                                                <td className="p-4 text-emerald-600 font-bold">{product.brand}</td>
                                                <td className="p-4 font-bold">{product.price.toLocaleString()} ج.م</td>
                                                <td className="p-4"><span className={`px-2.5 py-1 rounded-full text-xs font-bold ${product.stock > 5 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>{product.stock}</span></td>
                                                <td className="p-4 flex items-center gap-2">
                                                    <button onClick={() => { setEditingProduct(product); setProductForm({...product, imagesStr: product.images.join(', '), colors: product.variants.colors.join(', '), storage: product.variants.storage.join(', '), ram: product.variants.ram.join(', ')}); setAdminTab('productForm'); }} className="p-2 bg-blue-50 text-blue-600 rounded-xl"><i className="fa-solid fa-pen"></i></button>
                                                    <button onClick={() => deleteProduct(product.id)} className="p-2 bg-red-50 text-red-600 rounded-xl"><i className="fa-solid fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {adminTab === 'productForm' && (
                        <div className="bg-white dark:bg-dark-card p-8 rounded-3xl border border-gray-200 dark:border-dark-border max-w-3xl mx-auto">
                            <h3 className="text-xl font-bold mb-6">{editingProduct ? 'تعديل منتج' : 'إضافة منتج جديد'}</h3>
                            <form onSubmit={handleSaveProduct} className="space-y-4">
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold mb-1">الاسم بالعربية</label>
                                        <input type="text" required value={productForm.nameAr} onChange={(e) => setProductForm({...productForm, nameAr: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl p-3 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1">الاسم بالإنجليزية</label>
                                        <input type="text" required value={productForm.nameEn} onChange={(e) => setProductForm({...productForm, nameEn: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl p-3 text-sm" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold mb-1">الماركة</label>
                                        <select value={productForm.brand} onChange={(e) => setProductForm({...productForm, brand: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl p-3 text-sm">
                                            {brands.map(b => <option key={b} value={b}>{b}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1">السعر (ج.م)</label>
                                        <input type="number" required value={productForm.price} onChange={(e) => setProductForm({...productForm, price: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl p-3 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1">السعر الأصلي</label>
                                        <input type="number" value={productForm.originalPrice} onChange={(e) => setProductForm({...productForm, originalPrice: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl p-3 text-sm" />
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold mb-1">المخزون</label>
                                        <input type="number" required value={productForm.stock} onChange={(e) => setProductForm({...productForm, stock: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl p-3 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold mb-1">روابط الصور (مفصولة بفواصل)</label>
                                        <input type="text" required value={productForm.imagesStr} onChange={(e) => setProductForm({...productForm, imagesStr: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 dark:border-dark-border rounded-xl p-3 text-sm" />
                                    </div>
                                </div>
                                <div className="flex gap-4 pt-4">
                                    <button type="submit" className="px-6 py-3 bg-emerald-600 text-white font-bold rounded-xl text-xs">{t.save}</button>
                                    <button type="button" onClick={() => setAdminTab('products')} className="px-6 py-3 bg-gray-100 dark:bg-dark-border font-bold rounded-xl text-xs">{t.cancel}</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {adminTab === 'orders' && (
                        <div className="space-y-6">
                            <h3 className="text-xl font-bold">{t.manageOrders}</h3>
                            <div className="bg-white dark:bg-dark-card rounded-3xl border border-gray-200 dark:border-dark-border overflow-hidden">
                                <table className="w-full text-right text-sm">
                                    <thead className="bg-gray-50 dark:bg-dark-bg border-b border-gray-200 dark:border-dark-border text-xs text-gray-400 uppercase">
                                        <tr>
                                            <th className="p-4">رقم الطلب</th>
                                            <th className="p-4">العميل</th>
                                            <th className="p-4">الهاتف</th>
                                            <th className="p-4">العنوان</th>
                                            <th className="p-4">الإجمالي</th>
                                            <th className="p-4">الحالة</th>
                                            <th className="p-4">التاريخ</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 dark:divide-dark-border">
                                        {orders.map(order => (
                                            <tr key={order.id} className="hover:bg-gray-50/50">
                                                <td className="p-4 font-bold text-emerald-600">{order.reference}</td>
                                                <td className="p-4 font-bold">{order.customerName}</td>
                                                <td className="p-4">{order.phone}</td>
                                                <td className="p-4 text-xs">{order.city} - {order.area}</td>
                                                <td className="p-4 font-black">{order.total.toLocaleString()} ج.م</td>
                                                <td className="p-4">
                                                    <select value={order.status} onChange={(e) => updateOrderStatus(order.id, e.target.value)} className="bg-gray-50 dark:bg-dark-bg border border-gray-200 rounded-lg p-2 text-xs font-bold text-emerald-600">
                                                        <option value="Awaiting WhatsApp Confirmation">Awaiting WhatsApp</option>
                                                        <option value="Confirmed">Confirmed</option>
                                                        <option value="Processing">Processing</option>
                                                        <option value="Shipped">Shipped</option>
                                                        <option value="Delivered">Delivered</option>
                                                        <option value="Cancelled">Cancelled</option>
                                                    </select>
                                                </td>
                                                <td className="p-4 text-xs text-gray-400">{order.createdAt}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {adminTab === 'settings' && (
                        <div className="bg-white dark:bg-dark-card p-8 rounded-3xl border border-gray-200 dark:border-dark-border max-w-2xl mx-auto space-y-6">
                            <h3 className="text-xl font-bold">{t.storeSettings}</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold mb-1">رقم واتساب للطلبات (بدون +)</label>
                                    <input type="text" value={settings.whatsappNumber} onChange={(e) => setSettings({...settings, whatsappNumber: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 rounded-xl p-3 text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold mb-1">مصاريف الشحن الافتراضية (ج.م)</label>
                                    <input type="number" value={settings.deliveryFee} onChange={(e) => setSettings({...settings, deliveryFee: Number(e.target.value)})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 rounded-xl p-3 text-sm" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold mb-1">عنوان المتجر</label>
                                    <input type="text" value={settings.address} onChange={(e) => setSettings({...settings, address: e.target.value})} className="w-full bg-gray-50 dark:bg-dark-bg border border-gray-200 rounded-xl p-3 text-sm" />
                                </div>
                                <button onClick={() => alert('تم حفظ الإعدادات ومزامنتها سحابياً بنجاح!')} className="px-6 py-3 bg-emerald-600 text-white font-bold rounded-xl text-xs">
                                    {t.save}
                                </button>
                            </div>
                        </div>
                    )}

                    {adminTab === 'audit' && (
                        <div className="space-y-6">
                            <h3 className="text-xl font-bold">{t.auditLogs}</h3>
                            <div className="bg-white dark:bg-dark-card rounded-3xl border border-gray-200 dark:border-dark-border overflow-hidden">
                                <table className="w-full text-right text-sm">
                                    <thead className="bg-gray-50 dark:bg-dark-bg border-b border-gray-200 text-xs text-gray-400 uppercase">
                                        <tr>
                                            <th className="p-4">المسؤول</th>
                                            <th className="p-4">النشاط / الإجراء</th>
                                            <th className="p-4">التاريخ والوقت</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 dark:divide-dark-border">
                                        {auditLogs.map(log => (
                                            <tr key={log.id}>
                                                <td className="p-4 font-bold text-emerald-600">{log.admin}</td>
                                                <td className="p-4">{log.action}</td>
                                                <td className="p-4 text-xs text-gray-400">{log.timestamp}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
